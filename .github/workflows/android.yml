name: Android CI

on:
  push:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Only the newest build for a branch may publish the rolling APK release.
concurrency:
  group: oracle-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Python 3.13 for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Run Android lint
        run: gradle --no-daemon lintDebug
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK alignment and signature
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/oracle-apk-badging.txt
          grep -q "package: name='studio.oracle'" /tmp/oracle-apk-badging.txt
          grep -q "sdkVersion:'26'" /tmp/oracle-apk-badging.txt
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-studio-verification-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: oracle-studio-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: oracle-studio-debug-apk
          path: dist
      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ORACLE Studio — Latest Android APK
          body: |
            Automatically built from the latest successful main-branch commit.
            Download app-debug.apk directly. This is the APK file, not the zipped Actions artifact.
          target_commitish: main
          prerelease: true
          make_latest: false
          files: dist/app-debug.apk
          overwrite_files: true
          fail_on_unmatched_files: true
